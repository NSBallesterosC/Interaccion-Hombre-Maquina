<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHUN-LI vs RYU</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>CHUN-LI vs RYU</h2>

<img class="img-top" src="https://vsftv.com/site/wp-content/uploads/2015/09/charaselect600.png" alt="Chun-Li vs Ryu">

<div id="stats">

  <div class="stat-bloque personaje">
    <img src="https://www.toyark.com/wp-content/uploads/2021/08/Street-Fighter-V-Chun-Li-Prime-1-Studio-001-800x450.jpg" alt="Chun-Li">
    <strong>CHUN-LI</strong>
    <div class="barra-label">HP: <span id="chunli-hp">320</span></div>
    <div class="barra-track"><div id="chunli-hp-barra" class="barra hp-barra"></div></div>
    <div class="barra-label">Ki: <span id="chunli-ki">100</span></div>
    <div class="barra-track"><div id="chunli-ki-barra" class="barra ki-barra"></div></div>
  </div>

  <div class="stat-bloque personaje">
    <img src="https://www.cine.com/media/noticias/2024/06/202406274046882.jpg" alt="Ryu">
    <strong>RYU</strong>
    <div class="barra-label">HP: <span id="ryu-hp">280</span></div>
    <div class="barra-track"><div id="ryu-hp-barra" class="barra hp-barra"></div></div>
    <div class="barra-label">Ki: <span id="ryu-ki">100</span></div>
    <div class="barra-track"><div id="ryu-ki-barra" class="barra ki-barra"></div></div>
  </div>

</div>

<div id="acciones">
  <button onclick="atacar('patada-luz')">Patada Luz</button>
  <button onclick="atacar('patada-media')">Patada Media</button>
  <button onclick="atacar('spinning')">Spinning Bird</button>
  <button onclick="atacar('cargar')">Cargar Ki</button>
</div>

<div id="log"></div>

<script src="script.js"></script>
</body>
</html>
