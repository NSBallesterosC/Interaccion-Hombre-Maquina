<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHUN-LI vs RYU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="elegirPeleador">
        <h3>¿Con quién quieres pelear?</h3>
        <div class="contenedorPeleadores">
            <div class="opcionPeleador seleccionado" data-peleador="chunli">
                <img src="https://www.toyark.com/wp-content/uploads/2021/08/Street-Fighter-V-Chun-Li-Prime-1-Studio-001-800x450.jpg" alt="Chun-Li">
                <span>CHUN-LI</span>
            </div>
            <div class="opcionPeleador" data-peleador="ryu">
                <img src="https://www.cine.com/media/noticias/2024/06/202406274046882.jpg" alt="Ryu">
                <span>RYU</span>
            </div>
        </div>
    </div>

    <h2>CHUN-LI vs RYU</h2>
    
    <img class="imagenPrincipal" src="https://vsftv.com/site/wp-content/uploads/2015/09/charaselect600.png" alt="Chun-Li vs Ryu">

    <div id="estadisticas">
        <div class="bloqueEstadisticas peleador">
            <img src="https://www.toyark.com/wp-content/uploads/2021/08/Street-Fighter-V-Chun-Li-Prime-1-Studio-001-800x450.jpg" alt="Chun-Li">
            <strong>CHUN-LI</strong>
            <div class="etiquetaBarra">Vida: <span id="vidaChunli">10000</span></div>
            <div class="pistaBarra"><div id="barraVidaChunli" class="barra barraVida"></div></div>
            <div class="etiquetaBarra">Ataque Final: <span id="ataqueFinalChunli">0</span></div>
            <div class="pistaBarra"><div id="barraAtaqueFinalChunli" class="barra barraAtaqueFinal"></div></div>
        </div>
        
        <div class="bloqueEstadisticas peleador">
            <img src="https://www.cine.com/media/noticias/2024/06/202406274046882.jpg" alt="Ryu">
            <strong>RYU</strong>
            <div class="etiquetaBarra">Vida: <span id="vidaRyu">10000</span></div>
            <div class="pistaBarra"><div id="barraVidaRyu" class="barra barraVida"></div></div>
            <div class="etiquetaBarra">Ataque Final: <span id="ataqueFinalRyu">0</span></div>
            <div class="pistaBarra"><div id="barraAtaqueFinalRyu" class="barra barraAtaqueFinal"></div></div>
        </div>
    </div>

    <div id="botonesAtaque">
        <button onclick="golpear('spinning')">Spinning Bird Kick</button>
        <button onclick="golpear('kikoken')">Kikoken</button>
        <button onclick="golpear('senretsu')">Senretsukyaku</button>
        <button onclick="golpear('tensho')">Tenshokyaku</button>
    </div>

    <div id="registroPelea"></div>

    <script src="script.js"></script>
</body>
</html>
